        // Load only after window load AND a stretch of scroll quiet — on
        // phones load lands mid-first-scroll, and evaluating ~100KB of gtag
        // right then janks the hero exit. 12s hard cap so it always loads;
        // gtag() calls buffer into dataLayer meanwhile, conversions survive.
        function armGtag() {
          var quiet = setTimeout(loadGtag, 1500);
          setTimeout(loadGtag, 12000);
          window.addEventListener('scroll', function () {
            if (loaded) return;
            clearTimeout(quiet);
            quiet = setTimeout(loadGtag, 1200);
          }, { passive: true });
        }
        if (document.readyState === 'complete') {
          armGtag();
        } else {
          window.addEventListener('load', armGtag, { once: true });
        }
